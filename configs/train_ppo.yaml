# PPO training setup (Stable-Baselines3). Used by train.py.
algo: ppo
total_timesteps: 3000000
n_envs: 16
seed: 0
torch_threads: 4
scenarios: [normal, peak_season, supply_shortage, transport_disruption, warehouse_failure, multi_warehouse]

vec_normalize:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0

policy_kwargs:
  net_arch: {pi: [256, 256], vf: [256, 256]}

linear_lr: true          # decay the learning rate linearly to 0
hyperparams:
  learning_rate: 3.0e-4
  n_steps: 256           # per env -> 16 x 256 = 4096 samples per update
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.003
  vf_coef: 0.5
  max_grad_norm: 0.5

validation:
  every: 100000          # timesteps
  seeds: [5000, 5001]    # fixed validation episodes per training scenario (test seeds are 10000+)
